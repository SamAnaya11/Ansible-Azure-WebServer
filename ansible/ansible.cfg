# ---------------------------------------------------------------
# Configuración de Ansible para este proyecto.
#
# IMPORTANTE (WSL): Ansible ignora un ansible.cfg situado en el
# directorio actual si ese directorio es "world-writable", como
# ocurre en /mnt/c. Por eso se carga de forma explícita con:
#   export ANSIBLE_CONFIG=/mnt/c/.../Ansible-Azure-WebServer/ansible/ansible.cfg
# Las rutas relativas de este archivo se resuelven respecto a la
# carpeta donde está el propio ansible.cfg.
# ---------------------------------------------------------------

[defaults]
# Inventario generado por Terraform (inventory.tf) con la IP de la VM
inventory = inventory/hosts.ini

# Usuario por defecto; el inventario ya define ansible_user (prioridad mayor)
remote_user = azureuser

# Clave privada SSH: vive en WSL (~/.ssh) porque en /mnt/c no se pueden
# aplicar permisos 600 y SSH rechazaría la clave
private_key_file = ~/.ssh/lab_azure_ed25519

# Carpeta de roles del proyecto
roles_path = roles

# Detecta el Python de la VM sin mostrar el aviso de autodetección
interpreter_python = auto_silent

# SOLO PARA ESTE LABORATORIO: no comprobar la huella (host key) SSH.
# Motivo: la VM se destruye y recrea con frecuencia; una VM nueva puede
# recibir la misma IP con otra huella y SSH bloquearía la conexión con
# "REMOTE HOST IDENTIFICATION HAS CHANGED".
# En producción NO se hace: aceptar cualquier huella expone a ataques
# man-in-the-middle. Lo correcto es registrar las huellas en known_hosts
# o usar StrictHostKeyChecking=accept-new.
host_key_checking = False

[ssh_connection]
# Envía los módulos por la misma conexión SSH: menos conexiones, más rápido
pipelining = True
